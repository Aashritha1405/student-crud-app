<form action="/saveStudent" method="post">

    <input type="hidden" name="id" th:value="${student.id}">

    Name: <input type="text" name="name" th:value="${student.name}"><br><br>
    Email: <input type="text" name="email" th:value="${student.email}"><br><br>
    Course ID: <input type="number" name="courseId" th:value="${student.courseId}"><br><br>

    <button type="submit">Update</button>
</form>
